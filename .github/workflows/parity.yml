name: Parity report

# Rebuilds PARITY.md and docs/index.html from every app's default branch and commits it when it changed.
on:
  schedule:
    - cron: "17 5 * * *"
  push:
    branches: [main]
    paths: ["fixes/**", "apps.toml", "src/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: parity
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Scan
        id: scan
        # Exit 2 means a fingerprint went stale. The report is still committed, then the job fails.
        run: |
          set +e
          cargo run --release -- --root checkouts --clone --out PARITY.md
          echo "status=$?" >> "$GITHUB_OUTPUT"
          cargo run --release -- --root checkouts --format html --out docs/index.html
      - name: Commit
        # main may have moved since checkout (another run, a push). This report is the newest
        # scan, so put it on top of the latest main rather than the commit the run started from.
        run: |
          cp PARITY.md docs/index.html "$RUNNER_TEMP/"
          git fetch --quiet origin main
          git reset --quiet --hard origin/main
          cp "$RUNNER_TEMP/PARITY.md" PARITY.md
          cp "$RUNNER_TEMP/index.html" docs/index.html
          if git diff --quiet -- PARITY.md docs/index.html; then echo "no change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update parity report" -- PARITY.md docs/index.html
          git push
      - name: Fail on stale fingerprints or errors
        if: steps.scan.outputs.status != '0'
        run: exit ${{ steps.scan.outputs.status }}
